# 本番起動用。ビルド済みイメージ(docker/compose.build.yaml で作成)を image: 参照で起動する。
#
# Goアプリなので TCPポート + caddy_net ではなく、UNIXドメインソケット経由でホスト側Caddyに
# リバースプロキシしてもらう前提(growstar-docker-deploy skill 参照)。そのため caddy_net への
# 参加は不要で、このcomposeでは internal network のみを使う。
#
# 事前に:
#   mkdir -p /srv/sockets/zengin-api
#   mkdir -p /srv/containers/docker/zengin-api/app-data
#   chown -R 1000:1000 /srv/containers/docker/zengin-api/app-data   # appuser (uid 1000) で稼働
#
# updateサブコマンドは常駐させず、systemd timer から
#   docker compose -f docker/compose.yaml run --rm --no-deps app update
# として都度キックする(../systemd/ 参照)。

services:
  app:
    image: zengin-api-app:${TAG:-latest}
    command: ["serve"]
    environment:
      SOCKET_PATH: /srv/sockets/zengin-api/app.sock
      LOG_LEVEL: info
      RELOAD_INTERVAL: 5m
    volumes:
      - /srv/sockets/zengin-api:/srv/sockets/zengin-api
      - /srv/containers/docker/zengin-api/app-data:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "zengin-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  internal:
    driver: bridge
